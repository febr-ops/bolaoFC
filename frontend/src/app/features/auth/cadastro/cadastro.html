<div class="login-container">
  <div class="login-card">
    <div class="logo-area">
      <h1><span class="brand-blue">BOLAO</span> <span class="brand-green">FC ⚽</span></h1>
      <p>Crie sua conta e comece a pontuar</p>
    </div>

    <form class="login-form">
      <div class="form-group">
        <label for="name">Nome Completo</label>
        <input type="text" id="name" placeholder="Como a galera te conhece" name="name" required>
      </div>

      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="Digite seu melhor e-mail" name="email" required>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" placeholder="Crie uma senha segura" name="password" required>
      </div>

      <button type="submit" class="btn-primary">Criar Minha Conta</button>
    </form>

    <div class="login-footer">
      <p>Já tem uma conta? <a routerLink="/login">Faça o login aqui</a></p>
    </div>
  </div>
</div>
