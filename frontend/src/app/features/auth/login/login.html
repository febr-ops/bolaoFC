<div class="login-container">
  <div class="login-card">
    <div class="logo-area">
      <h1><span class="brand-blue">BOLAO</span> <span class="brand-green">FC ⚽</span></h1>
      <p>Dê os seus palpites e mije de rir com a galera</p>
    </div>

    <form class="login-form">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="Digite seu e-mail" name="email" required>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" placeholder="Digite sua senha" name="password" required>
      </div>

      <button type="submit" class="btn-primary">Entrar</button>
    </form>

    <div class="login-footer">
      <p>Ainda não tem conta? <a routerLink="/cadastro">Cadastre-se aqui</a></p>
    </div>
  </div>
</div>
